# Wapahki — flexible robotic packing cell (food manufacturing).
# Wapahki is NOT selling a proven robot with installations and savings. The
# first email's job is to discover ONE bounded, recurring physical task worth a
# closer look — not to sell equipment.

key = "wapahki"
name = "Wapahki"
signature = "Andrew"

one_liner = "I'm Andrew, the founder of Wapahki in Toronto. We're exploring a flexible robotic packing cell, and I'm speaking with manufacturers to understand where existing automation still breaks down."

motion = "one bounded, recurring physical task within a limited product or package family — a case-transfer, pack-out, or palletizing handoff that stays mechanically similar once a run is underway, while people keep the exceptions"

# Food-manufacturing discovery notes run a little longer to make the motion concrete.
min_words = 100
max_words = 160

min_signals = 1

system_concept_examples = [
  "a robotic cell that handles a recurring case-transfer between conveyor and pallet across a limited set of products",
  "a flexible packing cell that switches between a small range of case formats without a mechanical rebuild",
  "a cell that handles the normal pack-out motion while operators keep the exceptions (misfeeds, damage, off-orientation)",
  "a task-and-exception sketch of one end-of-line handoff (described in plain terms, never as an internal label)",
]

subject_examples = [
  "Question about finished pork packing at Conestoga",
  "Manual work on changing dessert lines",
  "Finished-case handling at Cardinal Meat",
  "Question about promotional pack-out",
  "Receiving work that still needs people",
]

vantage_notes = [
  "Production supervisor: can describe repeated movements, operator interventions, rates, and exceptions. Does not approve capital equipment.",
  "Packaging specialist: sees which packaging changes alter the physical work and which do not.",
  "Warehouse / receiving manager: can identify a recurring pallet or case-handling workflow; may not own robotics procurement.",
  "Commercialization manager: sees how new products and formats affect scale-up; may not know daily floor execution.",
  "Plant director: can compare programs and involve engineering — but do NOT assume a current automation project or budget.",
]

requirements = [
  "Test ONE bounded physical task or handoff, not the whole facility. Ask whether it stays repetitive within a run or changes enough to need operators.",
  "The question must be FALSIFIABLE — a good reply might be 'every order is different', 'the rate is too high', or 'sanitation makes it impractical'. All are useful.",
  "Be honest about Wapahki's stage (no installations, no proven savings, no ready product) but do NOT open with a disclaimer. Frame as 'we're exploring / speaking with manufacturers to understand'.",
  "The first useful outcome is a task sketch, a short video review, a variation table, a site visit, or an intro to production/engineering — NEVER a robotics purchase.",
  "Acknowledge real boundaries where relevant: food safety, sanitation, quality, product damage, variable packaging, retailer requirements, changeovers, guarding, operator intervention.",
  "Do not lead with Andrew's biography. The one-line identity is enough.",
  "'One question I'd value your opinion on' is a strong opener, especially on LinkedIn and short follow-ups — it asks for judgment, not a meeting.",
]

forbidden = [
  "embodied AI",
  "dynamic industrial",
  "general-purpose robot",
  "general purpose robot",
  "automate any",
  "end-to-end optimization",
]

doctrine = """
Wapahki's underlying question is always: does one recognizable motion or handoff
recur often enough that a flexible robotic cell could handle the NORMAL cases
while people keep the exceptions?

To form the hypothesis internally, know: what object moves, from where to where,
how often the motion repeats, what changes between runs, which exceptions
interrupt it, and whether those exceptions are occasional or constant. Put only
the single sharpest question into the email.

Falsifiable question shapes:
  - "During a single product run, is the final case-loading motion mostly
     consistent, or do differences in product shape still make operators adjust
     nearly every case?"
  - "When promotional packs change, is the hard part the physical pack-out
     itself, or the number of exceptions and change parts around it?"
  - "In receiving, is there one repeated transfer that stays consistent across
     loads, or do mixed pallets and damaged freight make nearly every cycle
     different?"

Translate internal terms into operational language:
  - NOT "bounded exception envelope" -> "the normal cases repeat, with only the
    occasional product needing a person".
  - NOT "task-and-exception sketch" -> "we could map the normal motion, the
    formats it covers, and the cases that still need a person".
  - NOT "embodied AI for dynamic workflows" -> "a robotic packing cell that
    switches between a limited set of products and case formats without being
    rebuilt each time".

Order: why this person -> one relevant operational observation -> the single
falsifiable question -> the one-line Wapahki identity + the narrow capability ->
a low-friction ask (a short call, OR a one-line reply, OR a pointer to the person
closest to the work — a correction is a successful outcome).

The shortest LinkedIn version, after they connect: "Thanks for connecting. One
question I'd value your opinion on. [specific operational question]. I'm trying
to understand whether this is genuinely a recurring automation gap or whether the
variation makes it a poor fit." No biography, no long pitch, no immediate call.
"""
