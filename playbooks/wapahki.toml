copy_doctrine = """
A sendable Wapahki first email starts with a plant problem, not Wapahki's robot
architecture. The recipient should recognize one station or handoff they have
seen and understand why Andrew is asking without searching the factory for a use
case.

Build the note from: (1) one identifiable station or handoff, (2) one observed
operating condition, (3) one suspected consequence such as overtime, a staffed
bottleneck, reduced output, stoppage, poor utilization, short-run economics,
ergonomic exposure, safety, or sanitation burden, (4) one sharp hypothesis
about why conventional automation struggles there, and (5) one question
answerable from memory. Arrive with the candidate task and invite correction.
Do not ask the recipient to classify where variation enters, decide whether a
motion fits a bounded exception envelope, or identify any suitable task.

Keep evidence readiness separate from cash-now, core, and strategic commercial
lanes. Every first touch needs a
source-supported package, product, station, line, machine, warehouse flow, job,
facility, expansion, or other physical operating clue and a recipient proven
to work at that facility. Every outreach-ready opportunity also has a credible,
atomic economic-pressure claim. Discovery-ready opportunities may receive one
task-specific email only when the task, consequence, facility, and recipient
relationship all have explicit lineage.
Research-required opportunities remain in research.
Never promote category or product variety into a factual manual-work claim.

Describe Wapahki only after the production moment and consequence are clear, if
the explanation is useful at all. One honest sentence is enough. Never explain
the proposed division between normal cases and exceptions before the recipient
confirms why the task remains manual. Never claim installations, performance,
savings, or a ready system.

Andrew may use the verified student/researcher context in the first note: he is
a University of Toronto student working in robotics at Automata. Used briefly,
that can explain the discovery intent and lower sales resistance. It is not a
substitute for a plant-specific hypothesis, and the conversation must become
openly commercial once it reaches requirements, economics, a prototype, or a
pilot. Never present Wapahki as purely academic research.

Wapahki has a real one-page automation-fit screen in seller context. It may be
offered once as a give-back covering the motion, run stability, changeover,
interventions, physical boundaries, rate, labour, and payback threshold. It is
not a benchmark or plant assessment. A later touch may use one explicitly
attributed discovery-call contrast, never as proof about the target.

Cold outreach contains one message. It tests one concrete task by contributing
the completed fit screen and asking one question. A single follow-up is allowed
only after it adds new evidence or a completed first-pass assessment. Never
manufacture a cadence from repeated caveats.
"""

doctrine = """
Wapahki's underlying question is always: does one recognizable motion or handoff
recur often enough that a flexible robotic cell could handle the NORMAL cases
while people keep the exceptions?

FIRST-PARTY DISCOVERY NOW SHARPENS THAT QUESTION. One technical manager described
two instructive boundaries: a design automation stopped around the repeatable
half because covering every exception was not worth the budget, while short-run
protective packing changed materials and handling logic too often for current
volume. A separate fleet-maintenance conversation described scheduled,
standardized work as the automatable slice and vehicle-to-vehicle variation as
the blocker. These are participant reports, not market proof and never facts
about a prospect. Use at most one of them in a later follow-up, only when it
creates a useful comparison: "In a recent conversation with a technical manager,
I heard... Does that match your line, or is it different?" Do not say "everyone
I speak with," imply consensus, or cite the rough economics externally.

To form the hypothesis internally, know: what object moves, from where to where,
how often the motion repeats, what changes between runs, which exceptions
interrupt it, and whether those exceptions are occasional or constant. Put only
the single sharpest question into the email.

EVIDENCE BRANCH. If public research proves only that the company makes several
products or formats, hold the account for more research. Do not ask a cold
recipient to find Wapahki's use case. A multi-touch sequence needs a bridge to
one physical candidate task and its economics: a named package, product,
station, line, machine, role, job posting, expansion, or plant document, plus an
observable pressure such as staffing, throughput, utilization, safety,
sanitation, or changeover cost. Unknowns are research gaps, not permission to
invent the station or consequence.

Weak-evidence accounts stay in research and produce no automatic copy. The
one-page fit screen belongs only after a human confirms a task and wants a
useful way to examine it. Every object, station, blocker, and operating
condition must come from account evidence; the playbook supplies no fallback
question shape.

Translate internal terms into operational language:
  - NOT "bounded exception envelope" -> "the normal cases repeat, with only the
    occasional product needing a person".
  - NOT "task-and-exception sketch" -> "we could map the normal motion, the
    formats it covers, and the cases that still need a person".
  - NOT "embodied AI for dynamic workflows" -> "a robotic packing cell that
    switches between a limited set of products and case formats without being
    rebuilt each time".

For Wapahki, use this first-email logic without turning it into a fixed template:
one verified station or handoff -> one observed operating condition -> one
suspected consequence -> one likely reason ordinary automation struggles ->
Andrew's credible researcher context -> one concrete Wapahki contribution ->
one natural operating question and one response path matched to evidence state. Do not stack a
call, email fallback, and asset offer into a response menu. The full
technical/economic discovery set belongs only after the plant-floor premise is
confirmed.

When the task is precise enough, the existing one-page automation-fit screen is
a real give-back, not invented collateral. Offer to apply it to that exact task
and return a first-pass view of motion stability, changeovers, interventions,
rate, labour, and payback threshold after the recipient supplies the one missing
operating fact. Never say the assessment already exists, and do not turn the
screen into a second CTA or reuse identical asset wording across accounts.

The shortest LinkedIn version should sound typed for this one person: one
specific plant-floor reference or a clean routing note. No biography, canned
"value your opinion" language, long pitch, or immediate call.

The funnel each thread advances (never pitch a robot): find the manual gap ->
understand WHY it is still manual (SKU/format/geometry variation, costly tooling,
slow changeovers, low volume) — that "why" IS the opportunity, qualify on it ->
narrow to the smallest automatable task described concretely -> test technical fit
(can perception+planning+a general arm absorb the variation cheaply?) -> establish
economics (operators, shifts, loaded wage, throughput, changeover, cycle time ->
a payback case) -> get agreement to EVALUATE that task against stated criteria
(e.g. "10 cases/min across 5 SKUs, <1% manual intervention") -> paid pilot ->
conditional LOI ("intends to deploy N cells for task Y, subject to pilot criteria,
~$X/cell"). Across the sequence, move from discovery (early touches: the task and
why it is manual) toward evidence and economics (later touches). The strategic
goal is many plants independently describing the SAME recurring gap, with a few
willing to evaluate/pilot/sign — the evidence base before the pre-seed raise.

The CRM stage gates are: hypothesis -> engaged -> problem confirmed -> task
mapped -> evidence shared -> evaluation agreed -> design partner -> LOI
candidate -> conditional LOI -> paid pilot -> deployment. An email send, open,
compliment, or booked meeting is activity, not a gate. Evidence shared means the
plant spends time or reputation on a sketch, video, SKU/changeover data, rate
data, site observation, or an internal introduction. Higher stages require an
explicit commitment; never infer them from enthusiasm.

An unanswered cold sequence does NOT climb this ladder. It stays at the
hypothesis stage and tests for a correction, referral, or first-hand account of
the task from different angles. After a human reply, the reply agent reads the
current CRM record and asks for only the next missing commitment. Discovery
questions must be about actual current or past work (what happened on the last
run, what changes, what operators do, what was tried), not hypothetical purchase
interest. A conditional LOI is useful only when it names the task/site,
provisional quantity, commercial or payback assumption, success criteria,
timeline, sponsor, and conditions to deploy.
"""
