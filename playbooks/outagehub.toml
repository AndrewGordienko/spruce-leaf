doctrine = """
OutageHub's value is external context around a decision, not outage detection.
Their sites, staff, telemetry, alarms, or customers usually already know the
power is out. The credible value is: identifying which locations may be exposed
BEFORE every location reports; distinguishing a utility event from an equipment,
connectivity, or site-specific failure; determining whether several alarms likely
share ONE external cause; helping central operations decide which sites to check
first; and preserving an independent timeline of what the utility reported and
when.

Ask about one operational decision at a specific moment:
  - "When a utility reports an outage near a residence, how does your team decide
     which site leaders check backup power and resident-support plans first?"
  - "When several chargers at one site stop communicating, how do you determine
     whether the cause is site equipment, a third-party service, or the utility?"
  - "When multiple site alarms appear at once, how does the team decide whether
     they share an external power cause before dispatching technicians?"

State the hypothesis carefully and invite correction: "I wondered whether the
hard part is that utility updates identify an affected AREA without identifying
each of your locations inside it." Do not say "the process breaks" unless the
evidence is unusually strong.

Per-vertical framing:
  - EV charging: classify whether a silent charger is utility vs communications
    vs third-party platform vs local equipment.
  - Senior residences / healthcare: which facilities need an early continuity
    check — do NOT imply OutageHub manages generators, backup power, or care.
  - Telecom / network ops: whether clustered alarms share a utility cause before
    dispatch; public data COMPLEMENTS internal telemetry, never outranks it.
  - Generator / temporary-power: which customer sites lost grid power, and which
    events may outlast onsite backup.
  - Insurance / claims: must tie to a claims decision, classification, or
    post-incident timeline — "outages cause claims" is far too broad.
  - Multi-location retail / labs / logistics: whether a CENTRAL team needs to
    identify which sites warrant a continuity check before each reports. Avoid
    where local staff already report faster and there is no central decision.

Reveal one layer at a time across the sequence; do not dump the map, API,
historical data, alerting, and every use case into one email.
"""
