copy_doctrine = """
This is a narrow two-email learning experiment, not an automated sales
sequence. Target only operators of Canadian EV charging sites. A candidate is
not sendable until research has matched one of the prospect's public operated
locations to a real utility outage area and timestamp. Never invent that match
or use a hypothetical result.

T1 is 60–95 words and contains one easy question. Start with the exact moment:
an entire charging site goes dark. Ask whether Service Operations still checks
the local utility before opening a network or equipment ticket, dispatching
someone, or updating customer status—or whether telemetry settles the cause
immediately. Mention OutageHub in one plain clause only if it helps explain why
Andrew is asking. Do not ask for a meeting or make the recipient validate an
abstract theory.

T2 arrives six days later and earns its existence with evidence. Name the
verified location, the utility-reported event, and the actual timestamp from
the completed historical match. Explain what an API response or webhook would
have shown at that moment without claiming the chargers lost power. Ask one
adjacent factual question at most. If there is no real result, there is no T2
and therefore no sendable sequence.

Use ordinary operational language: site goes dark, check the utility map, open
a ticket, dispatch a technician, update customers. Avoid abstract mechanism
labels, research narration, product disclaimers, and the visible machinery of
an automated sequence. Two unanswered emails end the experiment.
"""

doctrine = """
The current hypothesis is deliberately falsifiable: when an entire operated
charging site goes dark, some Service Operations teams may still check the
local utility before treating it as a charger, communications, platform, or
site-equipment incident. OutageHub matters only if that check is manual, late,
or absent in a way that changes ticketing, dispatch, or customer communication.

Research does the hard work before the recipient is contacted:
  1. Verify that the company operates Canadian charging sites.
  2. Resolve public site locations to utility territories.
  3. Find a genuine historical overlap with a utility outage area.
  4. Preserve the location, utility, event timestamp, source, and what an
     OutageHub API response would have contained.
  5. Find the person closest to site diagnosis or Service Operations.

The recipient is asked one fact they can answer from memory. T1 tests whether
the manual utility check exists. T2 supplies the historical result. A reply of
"yes," "telemetry already settles it," or "talk to this person" is useful.
Silence after T2 ends the sequence. Do not broaden the segment or invent more
touches to rescue a weak hypothesis.
"""
