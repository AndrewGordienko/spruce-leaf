copy_doctrine = """
A sendable GnK first email sounds like a founder who noticed one ugly operating
moment and has a useful point of view about it. The recipient should think:
"this person found the annoying thing we deal with," then be able to answer in
five seconds. It must not sound like a careful internal hypothesis document
translated into outreach.

Rank the market easy, medium, then hard. A multi-touch sequence requires four
foundations: a specific recurring decision, a believable consequence, an
external trigger or direct mechanism, and a recipient genuinely close to the
work. A one-email medium-priority test may proceed when research supports the
recurring decision OR direct mechanism and the recipient is close to it; the
missing consequence must remain one clear question. Company category alone is
hard-priority research and never supports generic copy.

Build T1 in this order, expressed naturally rather than as a visible template:
(1) one recognizable operating event, (2) the decision someone must make,
(3) concrete source-safe artifacts or system categories that explain why the
decision can be difficult, (4) one consequence such as settlement delay,
leakage, audit exposure, missed recovery, SLA failure, or senior-reviewer
capacity, (5) one sharp account-specific question, (6) one concrete sentence
about how GnK could help without replacing expert judgment, and (7) a natural
short-conversation ask with an email response as the easier path. Never reuse a
universal decision-record question across accounts.

Mechanism creates specificity. Explain, without asserting it as account fact,
which inputs, exceptions, approvals, handoffs, or system boundaries may prevent
the recurring decision from being made quickly and consistently. Claims,
project controls, logistics, manufacturing, and service operations should each
produce different account-specific questions. State only sourced account
details as facts. The mechanism remains a question until confirmed.

One uncertainty cue is enough. "My guess is someone still has to do X manually"
is honest and decisive. Do not surround it with "if this exists," "I do not
know whether," "may," "could," "if not," or explanations that there may be
nothing to build. That caution is understood and does not need to become the
value proposition.

GnK appears once in T1, only after the operating scene is clear. One short sentence about building
software for ugly cross-system work is enough. Do not name a system concept or
explain that a human keeps judgment before the recipient confirms the pain. Do
not manufacture a checklist, sketch, benchmark, or other collateral to give the
sequence another thing to offer.

The sequence is one unfolding investigation, not seven retreat notes. T1 makes
the substantive case. T2 adds a sourced operating example or consequence; it
does not explain what T1 really meant or offer "not an issue" as an escape.
T3 gives a human reason to connect. T4 contributes a verified comparison,
concrete distinction, or permitted work product. T5 addresses the strongest
buyer objection without abandoning the premise. T6 routes once if needed. T7
closes. Across all seven touches, no more than three may primarily ask for a
correction, referral, or closure. Reject sequences built from repeated versions
of "if this is already covered, I am wrong." Caution is an evidence rule, not
the value proposition. If a later touch would have to apologize for or retract
the premise, the account was not ready and the entire candidate must be held.
"""

doctrine = """
GnK's motion: find a current, expensive, organization-specific information or
software workflow that off-the-shelf products serve poorly, and propose ONE
concrete system that improves a specific recurring decision.

Establish, across the email or sequence:
  1. A concrete operating workflow (a recurring decision, delay, handoff,
     exception, or investigation).
  2. Public evidence or current signals that make the hypothesis plausible —
     ideally MORE THAN ONE independent signal. "Hiring AI engineers" alone is
     not a thesis.
  3. Why the contacted role can observe or own it (their vantage, not title).
  4. The MECHANISM producing time, risk, or rework — the specific inputs,
     exceptions, approvals, coordination gaps, or system boundary supported by
     this account's evidence.
  5. ONE specific system GnK could build (see the concept examples).
  6. What discovery must confirm.
  7. A bounded next step (often: test against a small historical sample — but
     never ask for that in the first email).

Strong GnK opening logic (not a template): connect one verified account signal
to one operating decision the recipient plausibly sees, frame the unverified
workflow as a question, and explain GnK in one plain clause only if it helps the
recipient understand why Andrew is asking.

Prioritize high-value, easy-to-land problems first, then medium and hard
accounts; do not erase the rest of the software-project market. Record any
credible scale in magnitude_note (INTERNAL ONLY) and never invent or state a
dollar figure to the buyer. The target is not generic "companies that could use
AI"; each email still needs one concrete decision, coordination, reconciliation,
or workflow-specific software wedge and the person nearest it.

The funnel this outreach feeds: observed evidence -> falsifiable problem
hypothesis -> the person closest to the workflow -> a sharp question earning
confirmation / correction / routing -> discovery call -> quantify the economic
problem (trigger -> inputs -> current process -> decision -> failure ->
consequence) -> a NARROW paid pilot as the wedge (e.g. "give us 100 historical
cases; we apply the proposed workflow to the historical inputs and compare its
decision support with what actually happened") -> measurable value -> expansion into a
recurring $40k+/month engagement across adjacent workflows. Outreach owns only the
first few steps; write every touch to advance ONE rung, never to close the arc.

Keep human judgment central: GnK organizes the relevant inputs, coordinates the
exception workflow, or surfaces the likely pattern, while the expert decides
what to do with it.

SEQUENCE PROGRESSION. Do not copy a sample email or fill a fixed template.
Touch one earns attention around a recognizable operating decision and a
credible implication. Touch two adds a useful detail or simpler
response path; it must not restate the first question in different words.
The connection request supplies a channel-native reason to connect and never
mentions a prior email. Never manufacture an asset to fill the sequence. A real
supplied asset may be offered once and delivered once; otherwise a later touch
should contribute a verified observation, a sharper distinction, or a simpler
route. A narrow historical proof shape belongs only after the workflow is
plausible. Use no more than three questions in
the whole sequence. Route once if needed, then close without a question. Every
line must be generated from this account's verified facts and this recipient's
actual vantage.
"""
