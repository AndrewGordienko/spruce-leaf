copy_doctrine = """
A sendable GnK first email sounds like one founder who noticed a recognizable
expensive moment and arrived with a bounded contribution. It is generated from
a validated SendableBrief, never from the old account hypothesis, mechanism,
or a bag of unrelated company facts.

Cold planning produces T1 only. In 60–110 words it names one verified trigger,
one expensive moment, and one concrete contribution. That contribution says
what GnK can examine, what it will return, what decision the result improves,
and how small the initial commitment is. Examples include reconstructing one
completed case into a cited timeline, reviewing a small closed sample for
missing support, or building a first exception queue from existing records.
Generic custom-software or AI capability is not an offer.

The first email asks one question answerable by email. It never requests a call
from a discovery-stage contact and never asks the recipient to educate GnK
before receiving value. Router and adjacent contacts receive a routing
question, not owner language.

Direct ownership requires a person-specific current source that explicitly
connects this recipient to the same work. A title, account keywords, and
account-level evidence may identify an adjacent person, but never a direct
owner. If the role, expensive moment, consequence, deliverable, customer input,
or improved decision cannot be supported, hold the account.

Write three structurally different unchanged candidates: operating question,
completed teardown, and routing question. A factual validator may reject them;
the buyer-perspective reviewers select or hold. Reviewers never rewrite, merge,
or expose the internal brief. Silence creates no automatic next touch.

An engaged account may progress through at most four conditional touches. Every
touch after T1 binds a new evidence, artifact, buyer-action, routing, objection,
or close record and receives exact-copy approval. Never prewrite four messages
merely because the maximum exists.
"""

doctrine = """
GnK finds a current, expensive, organization-specific information workflow and
offers one small result that can improve a specific recurring decision. The
offer is built before prose. Research may examine many accounts and hold most
of them; no unique evidence plus no useful give-back means no email.

A SendableBrief must bind account claim ids, one person-role claim, the exact
opportunity, expensive moment, plausible consequence, deliverable, required
customer input, improved decision, and expected reply. The writer receives
only that boundary. Old hypotheses and unrelated research are excluded so they
cannot leak into planning or review.

Useful first contributions are concrete: a cited timeline from one completed
case, a small closed-sample review for missing or contradictory support, an
exception queue from existing records, or a chronology around one delayed
event. State only capabilities and artifacts GnK can actually produce. Keep
expert judgment with the customer.

The final inbox judge sees only subject, body, recipient title, and GnK's public
description. It scores recipient value, specificity, credibility, reply ease,
and naturalness. Two independent reviewers must choose the same unchanged
candidate; any disagreement holds the message. Andrew's exact-copy approval is
the final gate and regeneration invalidates it.

Learn from positive replies, correct referrals, meetings, and qualified task
conversations by message mode, offer, segment, role, and evidence strength.
Never optimize for opens or a model's preference score. Prospect sending stays
disabled until 30 real messages exist, at least 24 are approved unchanged, and
there are zero wrong recipients or vague research-interview emails.
"""
