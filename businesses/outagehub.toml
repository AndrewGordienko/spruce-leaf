key = "outagehub"
name = "OutageHub"
summary = "Canada-wide power-outage intelligence: normalized live and historical utility data, geographic outage areas, provider coverage, and data-quality analytics through a REST API."

known_facts = [
  "OutageHub monitors Canadian utility providers and normalizes their public outage reports into one dataset.",
  "OutageHub exposes live and historical outage records through a REST API with time-range, outage-detail, and provider endpoints.",
  "Outage records can include provider, geographic polygon, affected-customer count, cause, outage type, planned status, start time, and estimated restoration time when the source utility publishes them.",
  "OutageHub tracks provider-level completeness across seven critical outage-reporting fields and preserves completeness history for analytics and benchmarking.",
  "OutageHub can use geographic outage areas to compare reported utility events with supplied locations and times.",
  "Its value is external utility context around an operational decision, not replacing private telemetry or claiming private site status.",
  "Andrew Gordienko is the founder.",
  "Andrew can prepare a small location-matched historical example from public utility reports for a prospect's Canadian locations, clearly labeled as an outside-in example rather than proof of private site status.",
]

unknowns = [
  "Legal incorporated name, incorporation jurisdiction, and incorporation date.",
  "Full-time employee count, revenue, and financial statements available for an application.",
  "Current technology-readiness level and documented R&D work plan.",
  "Available matching funds, prior government assistance, and stacking constraints.",
  "Quantified Canadian economic benefits, jobs, emissions impact, and customer evidence.",
  "Committed utility, municipal, academic, or commercial pilot partners.",
]

goals = [
  "Reach every credible API customer whose Canadian location-specific decision can improve with normalized utility-outage data; allocate selling time across cash-now replays, core API evaluations, and strategic embedded subscriptions.",
  "Find organizations with an outage-sensitive operational decision where a location-matched external grid signal changes the outcome, and become the API/webhook their existing system (NOC, dispatch, ServiceNow, Salesforce) consumes — not another dashboard.",
  "Find every credible funding, pilot, challenge, and advisory programme that could advance product development, validation, commercialization, or grid-resilience evidence.",
  "Build funder relationships and complete strong applications without claiming eligibility that has not been verified.",
]

constraints = [
  "Treat public outage information, private alarms, carrier telemetry, internal tickets, and site status as distinct data types.",
  "Never state that OutageHub is eligible for a programme until every mandatory criterion is evidenced.",
  "Never describe a repayable contribution, tax credit, loan, procurement, or challenge prize as a grant.",
]

[commercial]
currency = "CAD"
cash_constrained_below_runway_months = 6
max_active_strategic = 3
minimum_cash_now_pipeline_coverage = 3.0

[commercial.cash_constrained_allocation]
cash_now_share_bps = 7000
core_share_bps = 2000
strategic_share_bps = 1000

[commercial.stable_allocation]
cash_now_share_bps = 5000
core_share_bps = 3500
strategic_share_bps = 1500

[[commercial.offers]]
key = "historical_location_replay"
name = "Historical Location Replay"
lane = "cash_now"
description = "A bounded, no-integration comparison of supplied or public Canadian locations/incidents with historical utility outage records, including timestamps, providers, data limits, and what the API would have returned."
price_min_cents = 200000
price_max_cents = 1500000
delivery_days_min = 5
delivery_days_max = 20
payment_structure = "Paid upfront; exact price and cash timing remain unknown until the location set and buyer agree scope."
estimate_confidence = "hypothesis"
estimate_basis = [
  "Founder pricing hypothesis of CAD $2,000–$15,000 for a bounded historical replay; not a proven market price or recorded transaction.",
]
requires = [
  "A named outage-sensitive decision and operational owner.",
  "A bounded location or incident set with permission to analyze it.",
]
success_criteria = ["The buyer can decide whether external utility context changes the named workflow enough to justify API evaluation."]
exclusions = [
  "Claiming private site status from public outage data.",
  "Open-ended free custom analysis.",
]

[[commercial.offers]]
key = "api_evaluation"
name = "API Evaluation"
lane = "core"
description = "A limited API or webhook evaluation tied to one existing incident, dispatch, NOC, or service workflow and an explicit recurring subscription path."
price_min_cents = 750000
price_max_cents = 3000000
delivery_days_min = 30
delivery_days_max = 120
payment_structure = "Paid implementation/evaluation milestones with a defined subscription conversion gate."
estimate_confidence = "hypothesis"
estimate_basis = [
  "Founder implementation-value hypothesis of CAD $7,500–$30,000; not yet validated by a recorded buyer payment.",
]
requires = [
  "A historical replay or equivalent evidence that utility context changes a specific decision.",
  "A workflow owner, technical evaluator, success measure, and subscription path.",
]
success_criteria = ["The evaluation records whether and where external outage context improves the target workflow."]
exclusions = ["An integration without a named operational decision or recurring commercial path."]

[[commercial.offers]]
key = "enterprise_embedded_outage_data"
name = "Enterprise or Embedded Outage Data"
lane = "strategic"
description = "A larger embedded or enterprise subscription pursued only with sponsorship, security/legal ownership, procurement timing, and a paid first phase."
payment_structure = "Paid discovery/evaluation precedes custom enterprise work; final value remains unknown until buyer scope exists."
requires = [
  "A champion and executive or commercial sponsor.",
  "A compelling event, security path, procurement route, and paid first phase.",
]
success_criteria = ["A contracted recurring subscription with explicit workflow, coverage, and expansion gates."]
exclusions = ["Free custom pilots and speculative enterprise integrations."]

