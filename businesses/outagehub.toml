doctrine = """
This is a commercial founding sponsorship, not a grant request, donation,
investment, server-bill appeal, repayment for old work, or request to finance an
unbuilt idea. The immediate goal is one paid CAD $10,000 sponsorship. Prioritize
smaller Canadian companies in generator/backup power, grid/utility software,
emergency-management technology, electrical engineering/restoration, cloud and
