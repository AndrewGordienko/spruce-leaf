that the team funded the past year themselves, use one exact source-backed reason
the organization is relevant, and state CAD $10,000 directly. Include the
configured sponsor benefits and independence boundary. Ask exactly one direct
budget-or-routing question. Never invent a budget, operating runway,
infrastructure-cost breakdown, dynamic metric, endorsement, partnership, user,
customer, SLA, or private site status. Use one active cold contact per
organization and keep every draft manual until reviewed.
"""

