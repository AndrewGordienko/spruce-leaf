[[calendar.rules]]
key = "incident_operations_weekend_hypothesis"
industries = ["telecom", "utility", "health", "senior", "emergency", "infrastructure", "network", "charging"]
title_keywords = ["network operations", "noc", "incident", "emergency", "continuity", "dispatch", "site operations", "facilities", "reliability"]
channels = ["email", "linkedin", "linkedin_request", "linkedin_or_email"]
weekdays = ["tue", "wed", "thu", "sat", "sun"]
window_start = 8
window_end = 14
preferred_hours = [8, 10, 12]
rationale = "Explicit test hypothesis: genuine incident-operations roles in continuously operated sectors may review operational messages on weekends. This exception requires both a matching sector and title and must be replaced by observed response data when enough samples exist."

[[calendar.rules]]
key = "funding_and_public_sector_weekdays"
industries = ["public funding", "government", "economic development"]
title_keywords = ["program", "programme", "funding", "advisor", "innovation", "partnership"]
channels = ["email"]
weekdays = ["tue", "wed", "thu"]
window_start = 9
window_end = 16
preferred_hours = [9, 11, 14]
rationale = "Programme and public-sector enquiries remain weekday-only regardless of OutageHub's incident-operations weekend hypothesis."

