[funding]
objective = "Fund product R&D, data coverage, operational validation, commercialization, and Canadian grid-resilience or clean-technology evidence."
themes = [
  "electric-grid reliability and resilience",
  "utility and outage data",
  "clean technology and energy innovation",
  "Canadian technology R&D and commercialization",
  "critical infrastructure and emergency operations",
  "smart cities, geospatial data, and public-interest data",
  "applied AI and decision support",
]
project_shapes = [
  "R&D to improve location matching, event normalization, coverage, or evidence quality.",
  "A bounded pilot with a utility, municipality, research institution, or multi-site operator.",
  "Validation of whether external outage context changes classification, prioritization, dispatch, or continuity decisions.",
  "Commercialization, export, or adoption work where the programme explicitly supports those activities.",
]
preferred_contact_titles = [
  "Program Manager",
  "Funding Program Officer",
  "Innovation Advisor",
  "Industrial Technology Advisor",
  "Business Development Manager",
  "Partnerships Manager",
  "Innovation Manager",
  "Grid Innovation",
]
min_words = 80
max_words = 170
default_touches = 2
doctrine = """
Funding outreach is a pre-application inquiry, not a sales pitch and not a request
to award money by email. Lead with the named programme and one evidenced criterion.
Describe one bounded OutageHub project shape, then ask one question that materially
changes the go/no-go decision: applicant eligibility, eligible activity, project
fit, intake timing, required partner, or the right advisor. Do not send generic
seven-touch cadences to public servants. Prefer the programme's published contact;
use Apollo to find a credible advisor or programme owner only when the official
route is absent or a relationship is genuinely useful. A formal application,
budget, work plan, evidence, and portal submission remain separate governed steps.
"""

